# Eagle — nginx site for workk.work. Install on the shared server as:
#   /etc/nginx/sites-available/workk.work  (symlink into sites-enabled)
#
# Plain HTTP only; run certbot afterwards and it rewrites these blocks with TLS:
#   certbot --nginx -d workk.work -d www.workk.work -d app.workk.work -d api.workk.work
#
# Host ports must match .env.workk (API_HOST_PORT / DASHBOARD_HOST_PORT / WEB_HOST_PORT).

# ── Marketing site ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name workk.work www.workk.work;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Manager dashboard (SPA) ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.workk.work;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API + realtime + agent traffic ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.workk.work;

    # Screenshot ingest accepts up to 12 MB (ingest.controller.ts); leave headroom.
    client_max_body_size 16m;

    # Socket.IO. The dashboard connects with transports:["websocket"] only —
    # without these Upgrade headers live view fails outright, no polling fallback.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # The agent installer download streams a ~50 MB exe — don't buffer it to disk.
    location /api/agent/binary {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

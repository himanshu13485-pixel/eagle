name: Build agent binaries

# Builds the standalone agent binary on each OS (SEA uses the runner's own node).
# macOS binaries can only be produced on a macOS runner — this is that runner.
# Download the artifacts and place them on the server:
#   eagle-agent.exe → apps/agent/dist-bin/eagle-agent.exe   (or AGENT_EXE_PATH)
#   eagle-agent     → apps/agent/dist-bin/eagle-agent        (Mac: AGENT_EXE_MAC_PATH)
#   eagle-agent (from the Ubuntu runner) → the server's AGENT_EXE_LINUX_PATH (e.g. eagle-agent-linux)
on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          # `file` = the built binary's name; `name` = the (unique) artifact name,
          # since upload-artifact@v4 rejects duplicate artifact names and both the
          # Mac and Linux builds produce a file literally called "eagle-agent".
          - os: windows-latest
            file: eagle-agent.exe
            name: eagle-agent-windows
          - os: macos-latest
            file: eagle-agent
            name: eagle-agent-mac
          - os: ubuntu-latest
            file: eagle-agent
            name: eagle-agent-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:exe -w @eagle/agent
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/agent/dist-bin/${{ matrix.file }}
          if-no-files-found: error

# Production stack: Postgres + MinIO(S3) + API + dashboard + marketing.
# On the server:  docker compose -f infra/docker-compose.prod.yml up -d --build
# (or pull prebuilt ghcr images by setting `image:` and removing `build:`)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eagle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eagle}
      POSTGRES_DB: eagle
    volumes:
      - pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-eagle}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-eagle-secret}
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until (/usr/bin/mc alias set m http://minio:9000 ${S3_ACCESS_KEY:-eagle} ${S3_SECRET_KEY:-eagle-secret}) do sleep 2; done; /usr/bin/mc mb -p m/eagle-screenshots; exit 0;"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-your-org}/eagle-api:latest
    restart: unless-stopped
    depends_on: [postgres, minio]
    environment:
      DATABASE_URL: postgresql://eagle:${POSTGRES_PASSWORD:-eagle}@postgres:5432/eagle?schema=public
      API_PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set me}
      DEVICE_TOKEN_SECRET: ${DEVICE_TOKEN_SECRET:?set me}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: eagle-screenshots
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-eagle}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-eagle-secret}
      # Public URL agents + presigned links use (your domain):
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-http://localhost:4000}
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    image: ghcr.io/${GHCR_OWNER:-your-org}/eagle-dashboard:latest
    restart: unless-stopped
    ports:
      - "8080:80"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-your-org}/eagle-web:latest
    restart: unless-stopped
    ports:
      - "8081:80"

volumes:
  pg:
  minio:

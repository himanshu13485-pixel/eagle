server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # $uri/index.html before the SPA fallback, so the marketing site's
    # prerendered pages are served as themselves. Written out rather than
    # relying on `$uri/`, which makes nginx 301 /pricing to /pricing/ — a
    # redirect that wouldn't match the canonical URL those pages declare.
    #
    # The final /index.html keeps the dashboard working: it has no prerendered
    # routes, so every path there still falls back to the SPA shell.
    try_files $uri $uri/index.html /index.html;

    # HTML must not be cached the way the fingerprinted assets are, or a deploy
    # leaves visitors on the previous build until their cache expires.
    #
    # This has to live here rather than in a `location ~* \.html$` block:
    # nginx matches locations against the *request URI*, and these pages are
    # requested as /pricing, not /pricing/index.html, so an extension-based
    # block never fired. Every page therefore went out with no Cache-Control
    # at all, browsers cached it heuristically, and a returning visitor got
    # the previous build's markup pointing at an asset hash they still had
    # cached `immutable` — a blank page until they reloaded by hand.
    add_header Cache-Control "no-cache" always;
  }

  # Crawlers re-read these often, and they change on every deploy.
  location ~* /(robots\.txt|sitemap\.xml)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
